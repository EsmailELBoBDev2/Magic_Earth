name: CairoDrive drive-ready R2 hardening

on:
  push:
    branches: [ main ]
    paths:
      - tools/drive_ready_repo_transform.py
      - drive_ready_corridor_selftest.mjs
      - ci/drive_ready_live_probe.py
      - ci/drive_ready_live_match.mjs
      - .github/workflows/drive-ready-r2.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: cairodrive-drive-ready-r2
  cancel-in-progress: false

jobs:
  harden-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply drive-ready source hardening
        run: python3 tools/drive_ready_repo_transform.py "$GITHUB_WORKSPACE"

      - name: Run exact static and Cairo-corridor simulations
        run: |
          set -euo pipefail
          node --check payload/cairodrive-google-search-only.js
          node search_core_selftest.mjs
          node traffic_core_selftest.mjs
          node drive_ready_corridor_selftest.mjs
          bash -n verify_patcher.sh
          bash -n VERIFY_REPO.sh
          git diff --check

      - name: Commit hardened production source
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payload/cairodrive-google-search-only.js verify_patcher.sh VERIFY_REPO.sh
          if git diff --cached --quiet; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "Drive-ready R2 source was already committed."
          else
            git commit -m "Harden drive-ready search traffic simulation and smoothness"
            git push origin HEAD:main
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe live Google Places and Cairo traffic
        id: live
        continue-on-error: true
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_ROUTES_API_KEY: ${{ secrets.GOOGLE_ROUTES_API_KEY }}
          CAIRODRIVE_ANDROID_PACKAGE: com.cairodrive.app
          CAIRODRIVE_ANDROID_CERT_SHA1: C0202993D2D3659C9A8EFDBA2F9490471F3A71A7
          DRIVE_READY_LIVE_OUT: drive-ready-live.json
        run: |
          set -euo pipefail
          python3 ci/drive_ready_live_probe.py
          node ci/drive_ready_live_match.mjs drive-ready-live.json

      - name: Upload live probe evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CairoDrive-drive-ready-live-${{ github.run_id }}
          path: drive-ready-live.json
          if-no-files-found: warn
          retention-days: 14

      - name: Dispatch canonical signed build from hardened main
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build.yml --ref main
          echo "Dispatched canonical Build CairoDrive signed APK + AAB workflow."

      - name: Publish drive-ready summary
        if: always()
        run: |
          {
            echo '## CairoDrive drive-ready R2'
            echo '- Source hardening/simulation: completed before commit.'
            echo '- Street/building display: structured Google street_number preserved; Google formatted address used only as non-invented fallback.'
            echo '- Search failure: asynchronous libGEM native_call replay removed.'
            echo '- Search workload: 10-row lean field mask + max 4 native row injections per event-loop burst.'
            echo '- Traffic: stock Magic Earth owns native traffic preferences; Google advisory remains independent.'
            echo '- Simulation: passive Magic Lane startSimulation/startSimulationWithRoute capture enabled for test coverage.'
            echo '- Traffic workload: 2–5 minute refresh, 16 native paths max, 96 points/path max.'
            echo "- Live Google probe outcome: ${{ steps.live.outcome }}"
            echo '- Canonical signed build dispatched from hardened main.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require live Google probe
        if: ${{ steps.live.outcome != 'success' }}
        run: |
          echo "ERROR: source hardening was committed and build dispatched, but live Google probe failed. Inspect the probe step before declaring every network path verified." >&2
          exit 1
