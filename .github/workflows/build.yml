name: Build CairoDrive signed APK + AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_forensics:
        description: 'Run deep APK forensics even if build succeeds'
        required: false
        default: false
        type: boolean
      full_native_forensics:
        description: 'Generate detailed native reports for every arm64 library (larger artifact)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cairodrive-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CAIRODRIVE_PATCH_VERSION: '22.3'
  TARGET_PACKAGE: com.cairodrive.app
  APP_LABEL: CairoDrive
  FRIDA_VERSION: '17.17.0'
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    name: Compatibility, patch, package and sign
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Cache npm download store
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node24-npm-${{ hashFiles('payload/package.json', 'payload/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-npm-

      - name: Install pinned build dependencies
        run: ./ci/install-deps.sh

      - name: Materialize and SHA-verify selected upstream APK
        run: ./ci/materialize-base-apk.sh "$GITHUB_WORKSPACE/input/base.apk"

      - name: Evaluate compatibility and baseline delta
        id: compat
        shell: bash
        run: |
          set +e
          python3 ./tools/preflight.py "$GITHUB_WORKSPACE/input/base.apk" \
            --aapt2 "$(command -v aapt2)" --apksigner "$(command -v apksigner)" \
            --report "$GITHUB_WORKSPACE/preflight.json" > preflight.log 2>&1
          PRE=$?
          python3 ./ci/verify-target-routing-surface.py "$GITHUB_WORKSPACE/input/base.apk" > routing-surface.log 2>&1
          ROUTE=$?
          unzip -p "$GITHUB_WORKSPACE/input/base.apk" lib/arm64-v8a/libGEM.so > "$GITHUB_WORKSPACE/input/libGEM.preflight.so"
          EXTRACT_GEM=$?
          if [[ $EXTRACT_GEM -eq 0 ]]; then
            python3 ./tools/discover_gem_globals.py "$GITHUB_WORKSPACE/input/libGEM.preflight.so" \
              --json gem-globals.json > gem-globals.log 2>&1
            GEMDISC=$?
          else
            GEMDISC=$EXTRACT_GEM
            echo 'ERROR: could not extract arm64 libGEM.so for global discovery' > gem-globals.log
          fi
          python3 ./tools/compatibility_delta.py preflight.json \
            --baseline baseline/known-good.json --out compatibility-delta.json > compatibility-delta.log 2>&1
          DELTA=$?
          set -e

          if [[ $PRE -eq 0 && $ROUTE -eq 0 && $GEMDISC -eq 0 && $DELTA -eq 0 ]]; then COMP=true; else COMP=false; fi
          VERSION_SLUG="$(python3 -c 'import json,re; v=json.load(open("preflight.json")).get("versionName") or "unknown"; print(re.sub(r"[^0-9A-Za-z._-]+","-",v)[:80])' 2>/dev/null || echo unknown)"
          echo "compatible=$COMP" >> "$GITHUB_OUTPUT"
          echo "preflight_rc=$PRE" >> "$GITHUB_OUTPUT"
          echo "routing_rc=$ROUTE" >> "$GITHUB_OUTPUT"
          echo "gem_discovery_rc=$GEMDISC" >> "$GITHUB_OUTPUT"
          echo "delta_rc=$DELTA" >> "$GITHUB_OUTPUT"
          echo "version_slug=$VERSION_SLUG" >> "$GITHUB_OUTPUT"
          {
            echo '## CairoDrive upstream compatibility'
            echo "- compatible: **$COMP**"
            echo "- upstream: **$VERSION_SLUG**"
            echo "- preflight exit: $PRE"
            echo "- routing-surface exit: $ROUTE"
            echo "- libGEM global-discovery exit: $GEMDISC"
            echo "- known-good delta exit: $DELTA"
            echo '- Any unsafe structural drift fails closed and automatically starts deep forensics.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CairoDrive-compatibility-${{ github.sha }}
          path: |
            preflight.json
            preflight.log
            routing-surface.log
            gem-globals.json
            gem-globals.log
            compatibility-delta.json
            compatibility-delta.log
            input/SOURCE_INFO.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Fail closed on incompatible upstream
        if: ${{ steps.compat.outputs.compatible != 'true' }}
        run: |
          echo 'Compatibility gate refused this upstream APK. Automatic forensics will run next; no patched APK is published.' >&2
          exit 42

      - name: Validate Play upload signing key
        env:
          CAIRODRIVE_KEYSTORE_BASE64: ${{ secrets.CAIRODRIVE_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXPECTED_UPLOAD_CERT_SHA1: D9:19:59:58:60:C9:47:E3:FC:A6:5A:16:EF:FB:BF:9F:C3:E7:2F:9A
        run: ./ci/validate-signing-key.sh

      - name: Fetch pinned Frida Gadget
        run: ./ci/fetch-frida-gadget.sh "$GITHUB_WORKSPACE/input/frida-gadget-android-arm64.so"

      - name: Static patcher verification
        run: |
          set -euo pipefail
          ./verify_patcher.sh | tee VERIFY_OUTPUT.txt
          ./VERIFY_REPO.sh

      - name: Record toolchain provenance
        if: always()
        run: ./ci/toolchain-report.sh TOOLCHAIN_PROVENANCE.txt || true

      - name: Build Play-signed APK + AAB
        env:
          CAIRODRIVE_KEYSTORE_BASE64: ${{ secrets.CAIRODRIVE_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXPECTED_UPLOAD_CERT_SHA1: D9:19:59:58:60:C9:47:E3:FC:A6:5A:16:EF:FB:BF:9F:C3:E7:2F:9A
          FRIDA_GADGET: ${{ github.workspace }}/input/frida-gadget-android-arm64.so
          OUTDIR: ${{ github.workspace }}/out
        run: |
          set -euo pipefail
          ./build_cairodrive.sh "$GITHUB_WORKSPACE/input/base.apk" 2>&1 | tee BUILD_STAGE.log

      - name: Verify package identity + signatures
        run: |
          set -euo pipefail
          PREFIX="out/CairoDrive-v${CAIRODRIVE_PATCH_VERSION}"
          APK="${PREFIX}.apk"
          AAB="${PREFIX}.aab"
          UAPK="${PREFIX}-universal.apk"
          aapt2 dump badging "$APK" | grep -q "package: name='com.cairodrive.app'"
          aapt2 dump badging "$UAPK" | grep -q "package: name='com.cairodrive.app'"
          apksigner verify --verbose --print-certs "$APK"
          apksigner verify --verbose --print-certs "$UAPK"
          jarsigner -verify "$AAB"
          zipalign -c -v 4 "$APK" >/dev/null

      - name: Package build artifacts
        run: ./ci/package-artifacts.sh "$GITHUB_WORKSPACE/out" "$GITHUB_WORKSPACE/dist"

      - name: Upload drive-test artifact
        uses: actions/upload-artifact@v7
        with:
          name: CairoDrive-v${{ env.CAIRODRIVE_PATCH_VERSION }}-${{ steps.compat.outputs.version_slug }}-PLAY-SIGNED-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload build-stage evidence for automatic handoff
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CairoDrive-build-evidence-${{ github.sha }}
          path: |
            BUILD_STAGE.log
            VERIFY_OUTPUT.txt
            TOOLCHAIN_PROVENANCE.txt
            preflight.json
            preflight.log
            routing-surface.log
            gem-globals.json
            gem-globals.log
            compatibility-delta.json
            compatibility-delta.log
            input/SOURCE_INFO.txt
            out/BUILD_REPORT.txt
            payload/package-lock.json
          if-no-files-found: warn
          retention-days: 30

  forensics:
    name: Automatic future-APK reverse-engineering handoff
    needs: build
    if: >-
      ${{
        always() &&
        (
          needs.build.result == 'failure' ||
          (github.event_name == 'workflow_dispatch' && inputs.force_forensics)
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Checkout exact failed/current commit
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install reverse-engineering toolchain
        continue-on-error: true
        run: ./ci/install-forensics-deps.sh

      - name: Materialize exact SHA-pinned upstream APK
        id: source
        continue-on-error: true
        run: ./ci/materialize-base-apk.sh "$GITHUB_WORKSPACE/input/base.apk"

      - name: Download prior build evidence into handoff
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: CairoDrive-build-evidence-${{ github.sha }}
          path: forensics/prior-build

      - name: Run deep static reverse-engineering sweep
        if: ${{ steps.source.outcome == 'success' }}
        env:
          FULL_NATIVE_FORENSICS: ${{ github.event_name == 'workflow_dispatch' && inputs.full_native_forensics && '1' || '0' }}
        run: ./ci/future-forensics.sh "$GITHUB_WORKSPACE/input/base.apk" "$GITHUB_WORKSPACE/forensics"

      - name: Record source/materialization failure
        if: ${{ steps.source.outcome != 'success' }}
        run: |
          mkdir -p forensics
          cat > forensics/FUTURE_APK_REPORT.txt <<'TXT'
          classification=INPUT_MATERIALIZATION_FAILURE
          The selected APK could not be retrieved or its SHA256 did not match.
          Check base_apk_release.json / GitHub Release asset or legacy base_apk_parts.
          This is an input/provenance failure, not evidence that the patch is incompatible.
          TXT

      - name: Publish forensics summary
        if: always()
        run: |
          if [[ -f forensics/FUTURE_APK_REPORT.txt ]]; then
            echo '## Automatic future-APK forensics' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            head -n 140 forensics/FUTURE_APK_REPORT.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload one diagnostic handoff artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CairoDrive-FUTURE-APK-HANDOFF-${{ github.sha }}
          path: forensics/**
          if-no-files-found: warn
          retention-days: 30
