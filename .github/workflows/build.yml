name: Build CairoDrive signed APK + AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_forensics:
        description: 'Run deep APK forensics even if compatibility/build succeeds'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cairodrive-build-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_PACKAGE: com.cairodrive.app
  APP_LABEL: CairoDrive
  FRIDA_VERSION: '17.17.0'
  GH_TOKEN: ${{ github.token }}

jobs:
  compatibility:
    name: Compatibility gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      compatible: ${{ steps.compat.outputs.compatible }}
      preflight_rc: ${{ steps.compat.outputs.preflight_rc }}
      routing_rc: ${{ steps.compat.outputs.routing_rc }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install pinned build dependencies
        run: ./ci/install-deps.sh
      - name: Materialize and SHA-verify selected upstream APK
        run: ./ci/materialize-base-apk.sh "$GITHUB_WORKSPACE/input/base.apk"
      - name: Evaluate portable compatibility without guessing
        id: compat
        run: |
          set +e
          python3 ./tools/preflight.py "$GITHUB_WORKSPACE/input/base.apk" --report "$GITHUB_WORKSPACE/preflight.json" > preflight.log 2>&1
          PRE=$?
          python3 ./ci/verify-target-routing-surface.py "$GITHUB_WORKSPACE/input/base.apk" > routing-surface.log 2>&1
          ROUTE=$?
          set -e
          if [[ $PRE -eq 0 && $ROUTE -eq 0 ]]; then COMP=true; else COMP=false; fi
          echo "compatible=$COMP" >> "$GITHUB_OUTPUT"
          echo "preflight_rc=$PRE" >> "$GITHUB_OUTPUT"
          echo "routing_rc=$ROUTE" >> "$GITHUB_OUTPUT"
          {
            echo '## CairoDrive upstream compatibility'
            echo "- compatible: **$COMP**"
            echo "- preflight exit: $PRE"
            echo "- routing-surface exit: $ROUTE"
            echo '- If false, build is intentionally skipped and deep forensics starts automatically.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CairoDrive-compatibility-${{ github.sha }}
          path: |
            preflight.json
            preflight.log
            routing-surface.log
            input/SOURCE_INFO.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Fail closed when upstream surface is incompatible
        if: ${{ steps.compat.outputs.compatible != 'true' }}
        run: |
          echo 'Compatibility gate failed. Deep forensics will run automatically; no patched APK will be produced.' >&2
          exit 42

  build:
    name: Patch, package and sign
    needs: compatibility
    if: ${{ needs.compatibility.outputs.compatible == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install pinned build dependencies
        run: ./ci/install-deps.sh
      - name: Materialize and SHA-verify selected upstream APK
        run: ./ci/materialize-base-apk.sh "$GITHUB_WORKSPACE/input/base.apk"
      - name: Portable compatibility report
        run: python3 ./tools/preflight.py "$GITHUB_WORKSPACE/input/base.apk" --report "$GITHUB_WORKSPACE/preflight.json"
      - name: Verify routing/simulation surface
        run: python3 ./ci/verify-target-routing-surface.py "$GITHUB_WORKSPACE/input/base.apk"
      - name: Fetch pinned Frida Gadget
        run: ./ci/fetch-frida-gadget.sh "$GITHUB_WORKSPACE/input/frida-gadget-android-arm64.so"
      - name: Static verification
        run: |
          set -euo pipefail
          ./verify_patcher.sh | tee VERIFY_OUTPUT.txt
          ./VERIFY_REPO.sh
      - name: Build signed drive-test APK + AAB
        env:
          CAIRODRIVE_KEYSTORE_B64_FILE: ${{ github.workspace }}/ci/signing/drive-test.keystore.b64
          ANDROID_KEYSTORE_PASSWORD: cairodrive-drive-test-2026
          ANDROID_KEY_PASSWORD: cairodrive-drive-test-2026
          ANDROID_KEY_ALIAS: cairodrive
          FRIDA_GADGET: ${{ github.workspace }}/input/frida-gadget-android-arm64.so
          OUTDIR: ${{ github.workspace }}/out
        run: ./build_cairodrive.sh "$GITHUB_WORKSPACE/input/base.apk"
      - name: Verify package identity + signatures
        run: |
          set -euo pipefail
          APK=out/CairoDrive-v22.3.apk
          AAB=out/CairoDrive-v22.3.aab
          UAPK=out/CairoDrive-v22.3-universal.apk
          aapt2 dump badging "$APK" | grep -q "package: name='com.cairodrive.app'"
          aapt2 dump badging "$UAPK" | grep -q "package: name='com.cairodrive.app'"
          apksigner verify --verbose --print-certs "$APK"
          apksigner verify --verbose --print-certs "$UAPK"
          jarsigner -verify "$AAB"
          zipalign -c -v 4 "$APK" >/dev/null
      - name: Package build artifacts
        run: ./ci/package-artifacts.sh "$GITHUB_WORKSPACE/out" "$GITHUB_WORKSPACE/dist"
      - name: Upload drive-test artifact
        uses: actions/upload-artifact@v7
        with:
          name: CairoDrive-v22.3-DRIVE-TEST-com.cairodrive.app-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  forensics:
    name: Automatic future-APK forensics
    needs: [compatibility, build]
    if: >-
      ${{
        always() &&
        (
          needs.compatibility.outputs.compatible != 'true' ||
          needs.build.result == 'failure' ||
          (github.event_name == 'workflow_dispatch' && inputs.force_forensics)
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact failed/current commit
        uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install reverse-engineering toolchain
        run: ./ci/install-forensics-deps.sh
      - name: Materialize exact SHA-pinned upstream APK
        id: source
        continue-on-error: true
        run: ./ci/materialize-base-apk.sh "$GITHUB_WORKSPACE/input/base.apk"
      - name: Run deep static reverse-engineering sweep
        if: ${{ steps.source.outcome == 'success' }}
        run: ./ci/future-forensics.sh "$GITHUB_WORKSPACE/input/base.apk" "$GITHUB_WORKSPACE/forensics"
      - name: Record source/materialization failure
        if: ${{ steps.source.outcome != 'success' }}
        run: |
          mkdir -p forensics
          cat > forensics/FUTURE_APK_REPORT.txt <<TXT
          classification=INPUT_MATERIALIZATION_FAILURE
          The selected APK could not be retrieved or its SHA256 did not match.
          Check base_apk_release.json / private release asset or legacy base_apk_parts.
          This is an input/provenance failure, not evidence that the patch is incompatible.
          TXT
      - name: Publish forensics summary
        if: always()
        run: |
          if [[ -f forensics/FUTURE_APK_REPORT.txt ]]; then
            echo '## Automatic future-APK forensics' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            head -n 120 forensics/FUTURE_APK_REPORT.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload diagnostic artifact to send back for analysis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CairoDrive-FUTURE-APK-FORENSICS-${{ github.sha }}
          path: forensics/*
          if-no-files-found: error
          retention-days: 30
